services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pocketmechanic
      POSTGRES_PASSWORD: pocketmechanic_dev
      POSTGRES_DB: pocketmechanic
    ports:
      - "5432:5432"
    volumes:
      - pocketmechanic_pg:/var/lib/postgresql/data

volumes:
  pocketmechanic_pg:
